# KubeDeck Configuration
# Copy this file to config.yaml and customize as needed

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  cors:
    allowed_origins:
      - "*"
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - Accept
      - Authorization
      - Content-Type

database:
  type: sqlite  # sqlite, mysql, postgres
  dsn: data/kubedeck.db
  max_idle_conns: 5
  max_open_conns: 25
  conn_max_lifetime: 5m

auth:
  jwt_secret: ""  # Leave empty to auto-generate
  jwt_expiry: 24h
  encryption_key: ""  # Leave empty to auto-generate
  enable_oauth2: false
  oauth2_providers:
    - name: github
      client_id: ""
      client_secret: ""
      redirect_url: http://localhost:8080/api/auth/callback
      scopes:
        - user:email
    - name: google
      client_id: ""
      client_secret: ""
      redirect_url: http://localhost:8080/api/auth/callback
      scopes:
        - openid
        - email
        - profile

kubernetes:
  kubeconfig: ""  # Empty uses in-cluster config
  namespace: default
  in_cluster: true

ai:
  enabled: false
  providers:
    - type: ollama
      base_url: http://localhost:11434
      model: llama2
      timeout: 120
    - type: openai
      base_url: https://api.openai.com/v1
      api_key: ""
      model: gpt-3.5-turbo
      timeout: 60

logging:
  level: info  # debug, info, warn, error
  format: json  # json, text
  output_file: ""  # Empty uses stdout
